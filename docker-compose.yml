# 一键起全套：make demo-db && docker compose up --build
#   服务网页    http://localhost:8000
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3000  (admin / GRAFANA_ADMIN_PASSWORD，默认 admin)
# 所有端口默认只绑定本机（127.0.0.1）：公网访问应经过 nginx 反向代理。
# 注意 Docker 发布的端口会绕过 ufw 等主机防火墙，绑定 0.0.0.0 就等于对全网开放。
services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # 容器内用 subprocess 执行图表代码：app 容器本身就是隔离边界
      CHART_EXECUTOR: subprocess
    volumes:
      - app-data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  app-data:
